<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veltrixsecure Service Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E6F63'/%3E%3Cpath d='M8 9h4l4 11 4-11h4l-6 15h-4z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EDF0F2;--surface:#FFFFFF;--ink:#16232E;--muted:#5B6B78;--line:#D9DFE4;
  --brand:#0E6F63;--on-brand:#FFFFFF;
  --ok:#0E8A6D;--warn:#B77A00;--bad:#C93B3B;--p4:#5B6FB5;--violet:#7454C4;
  --ok-bg:#DDF3EC;--warn-bg:#FBF0D3;--bad-bg:#FBE4E4;--info-bg:#E4E9F7;--violet-bg:#ECE6F8;
  --side:#16232E;--side-ink:#C7D2DA;--side-muted:#8A9BA7;--side-active:#22394A;
  --shadow:0 12px 32px rgba(15,30,40,.18);
}
html[data-theme="dark"]{
  --bg:#0E1920;--surface:#15242E;--ink:#E6EDF2;--muted:#93A4B1;--line:#263744;
  --brand:#35B8A4;--on-brand:#08201C;
  --ok:#34C39B;--warn:#E8B23A;--bad:#EF6B6B;--p4:#8FA2E6;--violet:#B39BF0;
  --ok-bg:#12382F;--warn-bg:#3A2F12;--bad-bg:#40191B;--info-bg:#1F2A4A;--violet-bg:#2D2450;
  --side:#0A1318;--side-active:#182A35;
  --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.muted{color:var(--muted)}.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:22px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.brand svg{width:28px;height:28px;flex:none}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.brand span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav small{font-size:12px;color:var(--side-muted);padding:10px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav svg.i{width:18px;height:18px}
.nav .n{margin-left:auto;background:#ffffff1c;border-radius:99px;padding:0 7px;font-size:12px;min-width:22px;text-align:center}
.nav .n.hot{background:var(--bad);color:#fff}
.mewrap{margin-top:auto;position:relative}
.me{width:100%;background:none;border:0;border-top:1px solid #ffffff1f;color:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:10px}
.me:hover{background:var(--side-active)}
.menu.up{top:auto;bottom:calc(100% + 6px);left:0;right:0;min-width:0}
.me i{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:12px}
.me b{display:block;color:#fff;font-weight:500;font-size:13px}
.me span{font-size:12px;color:var(--side-muted)}
.wrap{min-width:0}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 32px}
.bar .grow{flex:1}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.gsearch>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:30;max-height:70vh;overflow:auto}
.sres[hidden]{display:none}
.sres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a:focus{background:var(--bg)}
.sres small{color:var(--muted);margin-left:auto;white-space:nowrap}
.sres .grp{font-size:12px;color:var(--muted);padding:6px 10px 2px}
.btn.menuBtn{display:none}
.main{padding:24px 32px 56px;max-width:1480px}
#navScrim{display:none}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-102%);visibility:hidden}
  .side.open{transform:none;visibility:visible}
  @media(prefers-reduced-motion:no-preference){.side{transition:transform .2s,visibility .2s}}
  #navScrim.on{display:block;position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:35}
  .btn.menuBtn{display:inline-flex}
  .bar{padding:10px 14px}.main{padding:18px 14px 48px}
  .bar .hide-s{display:none}
  .bar .grow{display:none}
  .gsearch{min-width:0}
}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--on-brand)}
a.btn.danger{color:var(--bad)}
.tbl td.title.cp{min-width:180px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{padding:7px 9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sel,.inp{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.sel{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;font-weight:500}
textarea.inp{width:100%;min-height:90px;resize:vertical;line-height:1.5}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:25}
.menu[hidden]{display:none}
.menu button,.menu a{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.menu button:hover,.menu a:hover{background:var(--bg)}
.menu .sep{height:1px;background:var(--line);margin:6px 0}
.menu .hd{padding:6px 10px;font-weight:600}

/* page */
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.ph h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ph p{color:var(--muted);margin-top:4px}
.ph .tools,.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.panel h2{font-size:15px;font-weight:600}
.panel .sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.panel h2.lead{font-size:22px;line-height:1.3;letter-spacing:-.01em;max-width:60ch}
.panel.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-c{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-d{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1180px){.g2,.g-c,.g-d,.g3{grid-template-columns:minmax(0,1fr)}}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--info-bg);color:var(--p4);font-size:12px;font-weight:500;vertical-align:middle;letter-spacing:0}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:8px;border:1px solid var(--bad);background:var(--bad-bg);margin-bottom:16px}
.banner.info{border-color:var(--p4);background:var(--info-bg)}
.banner.warn{border-color:var(--warn);background:var(--warn-bg)}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1280px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px}
.kpi>span{color:var(--muted);font-size:12.5px}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:4px}
.kpi b{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.kpi b small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi em{display:block;font-style:normal;font-size:12px;margin-top:6px}
a.kpi{text-decoration:none;color:inherit;display:block}
a.kpi:hover{background:var(--bg)}

/* chips, avatars */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--bg);color:var(--muted)}
.chip.p1,.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.p2,.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.p3,.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.p4,.chip.info{background:var(--info-bg);color:var(--p4)}
.chip.violet{background:var(--violet-bg);color:var(--violet)}
.chip.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--info-bg);color:var(--p4);font-size:11px;font-weight:600;flex:none}
.av.mine{background:var(--brand);color:var(--on-brand)}
.who{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.id{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.sla{font-weight:500;white-space:nowrap}
.sla.breached,.sla.missed{color:var(--bad)}.sla.risk{color:var(--warn)}.sla.met,.sla.ok{color:var(--muted)}.sla.paused{color:var(--p4)}

/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;font-weight:500;color:inherit}
.tbl th button:hover{color:var(--ink)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr[data-go]{cursor:pointer}
.tbl tbody tr[data-go]:hover td{background:var(--bg)}
.tbl td.title{min-width:240px;max-width:460px}
.tbl td.title small{display:block;color:var(--muted);font-size:12px}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .inp.q{flex:1;min-width:200px;max-width:340px}
.views{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.views button,.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px}
.views button[aria-pressed="true"],.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.views button small{opacity:.7;margin-left:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;color:var(--muted);font-size:13px}
.bulk{position:sticky;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;margin-top:12px;box-shadow:var(--shadow)}
.bulk .sel{background-color:var(--surface);color:var(--ink)}

/* tabs, steps */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.steps{display:flex;margin:0 0 16px;padding:0;list-style:none;overflow-x:auto}
.steps li{flex:1;min-width:110px;padding:8px 10px;border-bottom:3px solid var(--line);color:var(--muted);font-size:13px;white-space:nowrap}
.steps li.done{border-color:var(--brand);color:var(--ink)}
.steps li.cur{border-color:var(--brand);color:var(--ink);font-weight:600}
.steps li.fail{border-color:var(--bad);color:var(--bad);font-weight:600}

/* detail layout */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
@media(max-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dgrid .side-col{display:flex;flex-direction:column;gap:16px}
.props{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 10px;align-items:center;margin:0}
.props dt{color:var(--muted)}.props dd{margin:0;min-width:0}
.props .sel,.props .inp{width:100%}
.props dd{overflow-wrap:anywhere}
.props input[type=datetime-local]{font-size:13px;padding:6px 6px}
.dtitle{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:6px 0 10px}
.desc{white-space:pre-wrap;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.linkrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0}

/* activity */
.acts-list{display:flex;flex-direction:column;gap:14px;margin:8px 0 18px}
.ev{display:flex;gap:10px}
.ev .bub{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.ev .bub.note{background:var(--warn-bg);border-color:transparent}
.ev .bub .h{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.ev .bub .h b{color:var(--ink);font-weight:600}
.ev .bub p{white-space:pre-wrap}
.ev.sys{color:var(--muted);font-size:13px;align-items:center;gap:10px}
.ev.sys::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);margin:0 8px 0 8px;flex:none}
.composer{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.composer .tabs{margin:0;padding:0 8px;background:var(--bg)}
.composer textarea{border:0;border-radius:0;width:100%;min-height:96px;padding:10px 12px;background:var(--surface);resize:vertical;display:block}
.composer .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--bg)}
.composer.note textarea{background:var(--warn-bg)}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:22px;line-height:1;color:var(--line);padding:0 1px}
.stars button.on{color:var(--warn)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;align-items:start;padding-bottom:8px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:220px}
.col.over{outline:2px dashed var(--brand)}
.col h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:8px;cursor:grab;display:block;text-decoration:none;color:inherit}
.card:hover{border-color:var(--muted)}
.card .t{margin:4px 0 8px;font-weight:500}
.card .f{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px}

/* catalog */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.citem{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px}
.citem:hover{border-color:var(--brand)}
.citem b{font-weight:600}
.citem span{color:var(--muted);font-size:13px}
.citem .ico{width:34px;height:34px;border-radius:8px;background:var(--ok-bg);color:var(--brand);display:grid;place-items:center}
.citem .ico svg{width:18px;height:18px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal .dow{background:var(--bg);padding:6px 8px;color:var(--muted);font-size:12.5px}
.cal .d{background:var(--surface);min-height:104px;padding:6px;min-width:0}
.cal .d.dim{background:var(--bg)}
.cal .d>b{font-weight:500;font-size:12.5px;color:var(--muted)}
.cal .d.today>b{background:var(--brand);color:var(--on-brand);border-radius:99px;padding:1px 7px}
.cev{display:block;font-size:12px;border-radius:3px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.cev.low{background:var(--ok-bg);color:var(--ok)}.cev.medium{background:var(--warn-bg);color:var(--warn)}.cev.high{background:var(--bad-bg);color:var(--bad)}

/* prose */
.prose{max-width:74ch;line-height:1.65}
.prose h2{font-size:17px;margin:18px 0 6px}
.prose p{margin:8px 0}
.prose ul,.prose ol{padding-left:22px;margin:8px 0}
.prose code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px}
.kbcard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:inherit}
.kbcard:hover{border-color:var(--brand)}
.kbcard b{font-weight:600}
.kbcard span{color:var(--muted);font-size:13px}

/* matrix */
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;align-items:stretch}
.matrix .c{border-radius:6px;padding:10px 6px;text-align:center;font-weight:600}
.matrix .lab{color:var(--muted);font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* charts (reports) */
.strip{display:flex;align-items:flex-end;gap:2px;height:128px;margin-top:18px;border-bottom:1px solid var(--line)}

.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:12.5px;margin-top:10px}
.legend.inline{margin:0 0 6px}

.chartbox{width:100%;position:relative}.chartbox svg{display:block;width:100%;height:auto}
.aging{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;height:230px;align-items:end;border-bottom:1px solid var(--line);padding-top:10px}
.acol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}

.stack{display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}

.alabels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:6px;color:var(--muted);font-size:12px;text-align:center}
.cats{display:flex;flex-direction:column;gap:12px}

.bar2{height:8px;border-radius:2px;background:var(--bg);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--brand);border-radius:2px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}

.mini div{border-left:3px solid var(--line);padding-left:10px}
.mini span{display:block;color:var(--muted);font-size:12.5px}

.mini em{font-style:normal;font-size:12px;color:var(--muted)}
.load{display:flex;align-items:center;gap:8px;min-width:110px}.load .bar2{flex:1}

/* lists */
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plain li:last-child{border-bottom:0}
.plain b{display:block;font-weight:500}
.plain span.s{color:var(--muted);font-size:12.5px}
.sw{position:relative;width:34px;height:20px;border-radius:99px;border:0;background:var(--line);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff}

.link{border:0;background:none;color:var(--muted);padding:2px 4px;text-decoration:underline}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.pwd{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:6px 8px;border-radius:6px;word-break:break-all}

/* modal, toast, tip */
dialog.modal{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,94vw);box-shadow:var(--shadow);max-height:92vh}
dialog.modal.wide{width:min(760px,94vw)}
dialog.modal::backdrop{background:rgba(10,20,26,.5)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:17px}
.mh button{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.mb{padding:18px 20px;overflow:auto;max-height:calc(92vh - 140px)}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field>label{font-weight:500}
.field .inp,.field .sel{width:100%}
.field .err{color:var(--bad);font-size:12.5px;min-height:1em}
.field .hint{color:var(--muted);font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.suggest{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--info-bg);margin-bottom:12px;font-size:13px}
.suggest a{display:block;padding:2px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:no-preference){.toast{transition:opacity .2s,transform .2s}}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:6px;font-size:12.5px;z-index:90;opacity:0;max-width:260px;line-height:1.4}
.tip.on{opacity:1}

@media print{
  .side,.bar,.tools,.filters,.toolbar,.views,.acts,.no-print,.bulk{display:none!important}
  .app{display:block}.main{padding:0}body{background:#fff}
  .panel,.kpis{break-inside:avoid;box-shadow:none}
}

/* attachments, tasks, SLA rows */
.att{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .attic{width:32px;height:32px;border-radius:6px;background:var(--info-bg);color:var(--p4);display:grid;place-items:center;flex:none}

.task:last-child{border-bottom:0}
.task .sel{min-width:150px}
.slarow{margin-top:12px}
button.chip{border:0;cursor:pointer}

function dur(m){m=Math.max(0,Math.round(m));const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;if(d)return `${d}d ${h}h`;if(h)return `${h}h ${mm}m`;return `${mm}m`}

function rebase(o,delta,now){
  if(Array.isArray(o)){o.forEach(x=>rebase(x,delta,now));return}
  if(o&&typeof o==='object'){for(const k in o){const v=o[k];

    const met=t.resolvedAt!=null&&t.resolvedAt<=t.sla.res+t.pausedTotal;
    return {state:met?'met':'missed',left:null,label:met?'Met':'Missed'};
  }
  if(t.status==='Awaiting approval')return {state:'paused',left:null,label:'Awaiting approval'};
  if(t.pausedAt)return {state:'paused',left:null,label:'Paused: awaiting requester'};
  const left=Math.round((resDue(t)-now)/MIN);
  const respLate=!t.firstResponseAt&&t.sla.resp<now;
  const pol=db.settings.sla[t.priority];const risk=Math.max(30,pol.res*.2);
  if(respLate)return {state:'breached',left,label:'Response overdue '+dur((now-t.sla.resp)/MIN)};
  if(left<0)return {state:'breached',left,label:'Overdue '+dur(-left)};
  if(left<risk)return {state:'risk',left,label:'Due in '+dur(left)};
  return {state:'ok',left,label:'Due in '+dur(left)};
}

function setStatus(t,status,extra){
  extra=extra||{};const old=t.status;
  if(old===status&&!(status==='On Hold'&&extra.holdReason&&extra.holdReason!==t.holdReason))return;
  const now=Date.now();
  if(status==='Resolved'){t.resolvedAt=now;if(!t.firstResponseAt)t.firstResponseAt=now;if(extra.code)t.resCode=extra.code;if(extra.note!=null)t.resolution=extra.note}
  if(status==='Closed'){t.closedAt=now;if(!t.resolvedAt)t.resolvedAt=now}
  const reopen=(old==='Resolved'||old==='Closed')&&OPEN_ST.includes(status);
  if(reopen){t.resolvedAt=null;t.closedAt=null;t.reopened++}
  t.holdReason=status==='On Hold'?(extra.holdReason||t.holdReason||'Waiting for requester'):'';
  t.status=status;
  if(status==='In Progress'&&!t.assignee){t.assignee=ME;addAct(t,'system','Assigned to You')}
  syncPause(t);
  addAct(t,'system',status==='Resolved'?'Resolved ('+t.resCode+'): '+t.resolution:reopen?'Reopened. State set to '+status:status==='On Hold'?'State changed from '+old+' to On Hold ('+t.holdReason+')':'State changed from '+old+' to '+status);

}

const AttachStore=(()=>{
  const mem=new Map();let dbp=null;
  const open=()=>dbp||(dbp=new Promise(res=>{try{const r=indexedDB.open('veltrixsecure-attachments',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}}));
  const tx=async(mode,fn)=>{const d=await open();if(!d)return null;return new Promise(res=>{try{const t=d.transaction('files',mode),rq=fn(t.objectStore('files'));t.oncomplete=()=>res(rq&&rq.result!==undefined?rq.result:true);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}})};
  return {
    async put(id,blob){const ok=await tx('readwrite',s=>s.put(blob,id));if(!ok)mem.set(id,blob);else mem.delete(id)},
    async get(id){if(mem.has(id))return mem.get(id);const r=await tx('readonly',s=>s.get(id));return r&&r!==true?r:null},
    async del(id){mem.delete(id);await tx('readwrite',s=>s.delete(id))},
    async clear(){mem.clear();await tx('readwrite',s=>s.clear())}};
})();
const fsize=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';
function checkFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(BLOCKED_EXT.includes(ext))return f.name+': .'+ext+' files are not allowed.';
  if(f.size===0)return f.name+': the file is empty.';
  if(f.size>MAX_FILE)return f.name+': larger than '+(MAX_FILE/1048576)+' MB.';
  return null;
}

    const m={id:'att_'+uid()+uid(),name:f.name,size:f.size,type:f.type||'',by:ME,at:Date.now()};
    await AttachStore.put(m.id,f);rec.attachments.push(m);done.push(m)}
  if(done.length&&!quiet){addAct(rec,'system','Attached '+done.map(m=>m.name).join(', '));log('Attached '+done.length+' file'+(done.length>1?'s':''),rec.id)}

}

function md(src){
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  let out='',list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const raw of esc(src).split('\n')){const l=raw.trimEnd();let m;
    if((m=l.match(/^##\s+(.*)/))){close();out+=`<h2>${inline(m[1])}</h2>`}
    else if((m=l.match(/^\d+\.\s+(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`}
    else if((m=l.match(/^-\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`}
    else if(!l.trim())close();
    else{close();out+=`<p>${inline(l)}</p>`}}
  close();return out;
}

const TCOLS={
  sel:{h:t=>'',c:(t,o)=>`<td><input type="checkbox" data-in="tk-sel" data-id="${t.id}" aria-label="Select ${t.id}" ${o.selected&&o.selected.has(t.id)?'checked':''}></td>`},
  id:{h:'ID',k:'created',c:t=>`<td class="id">${t.id}${t.major?' <span class="chip bad" title="Major incident">Major</span>':''}</td>`},
  title:{h:'Summary',k:'title',c:(t,o)=>`<td class="title ${o.compact?'cp':''}">${esc(t.title)}<small>${o.compact?t.id+' · '+esc(t.cat):(t.kind==='request'?'Request':'Incident')+' · '+esc(t.cat)}</small></td>`},
  cust:{h:'Customer',k:'cust',c:t=>`<td style="white-space:nowrap">${esc(custShort(t.cust))}<small class="muted" style="display:block;font-size:12px">${esc(personName(t.requester))}</small></td>`},
  pri:{h:'Priority',k:'priority',c:t=>`<td>${priChip(t.priority)}</td>`},
  status:{h:'State',k:'status',c:t=>`<td>${statChip(t.status)}${t.status==='On Hold'&&t.holdReason?`<small class="muted" style="display:block;font-size:12px">${esc(t.holdReason)}</small>`:''}</td>`},
  owner:{h:'Owner',k:'assignee',c:t=>`<td>${ownerCell(t.assignee)}</td>`},
  sla:{h:'SLA',k:'sla',c:t=>`<td>${slaCell(t)}</td>`},
  upd:{h:'Updated',k:'updated',c:t=>`<td class="muted" style="white-space:nowrap">${ago(t.updatedAt)}</td>`}};
function ticketTable(list,o={}){
  const cols=o.cols||['id','title','cust','pri','status','owner','sla','upd'];
  if(!list.length)return emptyMsg(o.empty||'No tickets match. Try clearing a filter.');
  const head=cols.map(k=>{const c=TCOLS[k];if(k==='sel')return `<th style="width:34px"><input type="checkbox" data-in="tk-selall" aria-label="Select all on this page" ${o.allSel?'checked':''}></th>`;
    if(o.sortAct&&c.k){const on=o.sort&&o.sort.k===c.k;return `<th aria-sort="${on?(o.sort.dir>0?'ascending':'descending'):'none'}"><button data-act="${o.sortAct}" data-k="${c.k}">${c.h}${on?(o.sort.dir>0?' &#9650;':' &#9660;'):''}</button></th>`}
    return `<th>${c.h}</th>`}).join('');
  return `<div class="scroll"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${list.map(t=>`<tr data-go="#/tickets/${t.id}">${cols.map(k=>TCOLS[k].c(t,o)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function sortTickets(list,s){
  const key={created:t=>t.createdAt,title:t=>t.title.toLowerCase(),cust:t=>custName(t.cust),priority:t=>t.priority,status:t=>STATUSES.indexOf(t.status),assignee:t=>agentName(t.assignee),
    sla:t=>{const i=slaInfo(t);return i.left==null?1e9:i.left},updated:t=>t.updatedAt}[s.k]||(t=>t.createdAt);
  return [...list].sort((a,b)=>{const x=key(a),y=key(b);return (typeof x==='string'?x.localeCompare(y):x-y)*s.dir});
}

function searchAll(q){

  const add=(grp,arr,fn)=>arr.slice(0,4).forEach(x=>out.push({grp,...fn(x)}));
  add('Tickets',db.tickets.filter(t=>m(t.id)||m(t.title)||m(personName(t.requester))),t=>({href:'#/tickets/'+t.id,t:t.title,s:t.id}));
  add('Problems',db.problems.filter(p=>m(p.id)||m(p.title)),p=>({href:'#/problems/'+p.id,t:p.title,s:p.id}));
  add('Changes',db.changes.filter(c=>m(c.id)||m(c.title)),c=>({href:'#/changes/'+c.id,t:c.title,s:c.id}));
  add('Tasks',db.tasks.filter(t=>m(t.id)||m(t.title)),t=>({href:'#/tasks/'+t.id,t:t.title,s:t.id}));
  add('Requests',db.requests.filter(r=>m(r.id)),r=>({href:'#/requests/'+r.id,t:'Request '+r.id+' ('+r.items.length+' item'+(r.items.length>1?'s':'')+')',s:personName(r.requestedFor)}));

  add('Knowledge base',db.kb.filter(a=>m(a.title)||m(a.tags.join(' '))),a=>({href:'#/kb/'+a.id,t:a.title,s:a.id}));

/* ====================== shared stats ====================== */
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const slaMet=t=>t.resolvedAt!=null&&t.resolvedAt<=t.sla.res+t.pausedTotal;
function dailyStats(list,n){
  const today=startOfDay(Date.now()),out=[];
  for(let i=0;i<n;i++){
    const s=today-(n-1-i)*DAY,e=s+DAY;
    const created=list.filter(t=>t.createdAt>=s&&t.createdAt<e).length;
    const res=list.filter(t=>t.resolvedAt&&t.resolvedAt>=s&&t.resolvedAt<e);
    const met=res.filter(slaMet).length;
    out.push({s,created,resolved:res.length,sla:res.length?met/res.length*100:null,met});
  }
  return out;
}
function healthStrip(days){
  const max=Math.max(1,...days.map(x=>x.created));
  return `<div class="strip" id="strip">${days.map(x=>{
    const cls=x.sla==null?'none':(x.sla>=95?'':(x.sla>=90?'mid':'low'));
    const tp=`<b>${dlong(x.s)}</b><br>${x.sla==null?'No tickets resolved':'SLA compliance '+x.sla.toFixed(1)+'%'}<br>${x.created} created, ${x.resolved} resolved`;
    return `<i class="${cls}" data-tip="${esc(tp)}" style="height:${(14+x.created/max*86).toFixed(1)}%"></i>`}).join('')}</div>
   <div class="axis"><span>${dshort(days[0].s)}</span><span>${dshort(days[days.length-1].s)}</span></div>
   <div class="legend"><span><u style="background:var(--ok)"></u>95% or higher</span><span><u style="background:var(--warn)"></u>90% to 95%</span><span><u style="background:var(--bad)"></u>Below 90%</span><span><u style="background:var(--line)"></u>Nothing resolved</span><span>Bar height shows tickets created that day</span></div>`;
}
function overallSla(list,from,to){
  const r=list.filter(t=>t.resolvedAt&&t.resolvedAt>=from&&t.resolvedAt<to);
  return r.length?r.filter(slaMet).length/r.length*100:null;
}

/* ====================== tickets: list & board ====================== */
UI.tk={view:'list',quick:'open',q:'',type:'',pri:'',team:'',agent:'',cust:'',cat:'',sort:{k:'created',dir:-1},page:1,sel:new Set()};
const PAGE_SIZE=25;
function tkFiltered(){
  const f=UI.tk,q=f.q.trim().toLowerCase();
  return db.tickets.filter(QUICK[f.quick][1]).filter(t=>(!f.type||t.kind===f.type)&&(!f.pri||t.priority===+f.pri)&&(!f.team||t.team===f.team)&&(!f.agent||(f.agent==='none'?!t.assignee:t.assignee===f.agent))&&(!f.cust||t.cust===f.cust)&&(!f.cat||t.cat===f.cat)
    &&(!q||t.id.toLowerCase().includes(q)||t.title.toLowerCase().includes(q)||personName(t.requester).toLowerCase().includes(q)||custName(t.cust).toLowerCase().includes(q)));
}

function tkBody(){
  const f=UI.tk,list=tkFiltered();
  const counts=Object.keys(QUICK).map(k=>[k,db.tickets.filter(QUICK[k][1]).length]);
  $('#tk-quick').innerHTML=counts.map(([k,n])=>`<button data-act="tk-quick" data-k="${k}" aria-pressed="${f.quick===k}">${QUICK[k][0]}<small>${n}</small></button>`).join('');
  $('#tk-sub').textContent=`${list.length} ${list.length===1?'ticket':'tickets'} match the current filters.`;
  if(f.view==='board'){$('#tk-body').innerHTML=tkBoard(list);return}
  const sorted=sortTickets(list,f.sort),pages=Math.max(1,Math.ceil(sorted.length/PAGE_SIZE));if(f.page>pages)f.page=pages;
  const slice=sorted.slice((f.page-1)*PAGE_SIZE,f.page*PAGE_SIZE);
  const allSel=slice.length&&slice.every(t=>f.sel.has(t.id));
  $('#tk-body').innerHTML=ticketTable(slice,{cols:['sel','id','title','cust','pri','status','owner','sla'],sortAct:'tk-sort',sort:f.sort,selected:f.sel,allSel})+
   `<div class="pager"><span>Showing ${sorted.length?(f.page-1)*PAGE_SIZE+1:0} to ${Math.min(sorted.length,f.page*PAGE_SIZE)} of ${sorted.length}</span><span class="tools"><button class="btn sm" data-act="tk-page" data-d="-1" ${f.page<=1?'disabled':''}>${ic('chevL')}Previous</button><span>Page ${f.page} of ${pages}</span><button class="btn sm" data-act="tk-page" data-d="1" ${f.page>=pages?'disabled':''}>Next${ic('chevR')}</button></span></div>`+
   (f.sel.size?`<div class="bulk"><b>${f.sel.size} selected</b>
     <select class="sel" data-in="tk-bulk" data-f="assign" aria-label="Assign selected">${agentOpts('','Assign to...')}</select>
     <select class="sel" data-in="tk-bulk" data-f="status" aria-label="Set state">${selOpts(['In Progress','On Hold','Closed'],'','Set state...')}</select>
     <button class="btn sm" data-act="tk-selclear">Clear selection</button></div>`:'');
}
function tkBoard(list){
  const cols=['New','In Progress','On Hold','Awaiting approval','Resolved'];
  return `<div class="board">${cols.map(c=>{const items=sortTickets(list.filter(t=>t.status===c),{k:'sla',dir:1});
    return `<div class="col" data-drop="${c}"><h3>${c}<span class="muted">${items.length}</span></h3>${items.slice(0,20).map(t=>`<a class="card" draggable="true" data-drag="${t.id}" href="#/tickets/${t.id}"><div class="f"><span class="id">${t.id}</span>${priChip(t.priority)}</div><div class="t">${esc(t.title)}</div><div class="f"><span class="who">${avatar(t.assignee)}<span class="muted">${esc(custName(t.cust).split(' ')[0])}</span></span>${slaCell(t)}</div></a>`).join('')||'<div class="empty" style="padding:16px 4px">Nothing here</div>'}${items.length>20?`<p class="muted" style="margin-top:8px">+${items.length-20} more. Use filters to narrow.</p>`:''}</div>`}).join('')}</div>
   <p class="sub" style="margin:8px 0 0">Drag a card to another column to change its status.</p>`;
}

  'tk-view':el=>{UI.tk.view=el.dataset.v;$$('[data-act="tk-view"]').forEach(b=>b.setAttribute('aria-pressed',b===el));tkBody()},
  'tk-quick':el=>{UI.tk.quick=el.dataset.k;UI.tk.page=1;UI.tk.sel.clear();tkBody()},

  dropStatus:(id,status)=>{const t=ticket(id);if(!t||t.status===status)return;

Object.assign(INP,{
  'tk-q':el=>{UI.tk.q=el.value;UI.tk.page=1;tkBody()},
  'tk-f':el=>{UI.tk[el.dataset.f]=el.dataset.f==='pri'?(el.value?+el.value:''):el.value;UI.tk.page=1;tkBody()},
  'tk-sel':el=>{el.checked?UI.tk.sel.add(el.dataset.id):UI.tk.sel.delete(el.dataset.id);tkBody()},
  'tk-selall':el=>{const f=UI.tk,s=sortTickets(tkFiltered(),f.sort).slice((f.page-1)*PAGE_SIZE,f.page*PAGE_SIZE);s.forEach(t=>el.checked?f.sel.add(t.id):f.sel.delete(t.id));tkBody()},
  'tk-bulk':el=>{
    if(!el.value)return;const ids=[...UI.tk.sel].map(ticket).filter(Boolean),f=el.dataset.f;
    let skipped=0;
    ids.forEach(t=>{if(t.status==='Closed'){skipped++;return}
      if(f==='assign')assignTicket(t,el.value);
      else if(f==='status'){const err=transitionError(t,el.value);if(err){skipped++;return}setStatus(t,el.value,{holdReason:'Waiting for requester'})}});
    toast(`Updated ${ids.length-skipped} tickets`+(skipped?`. ${skipped} skipped because that state is not allowed for them.`:''));UI.tk.sel.clear();tkBody();renderNav('tickets')}
});

/* ====================== attachments (shared by tickets, problems, changes) ====================== */
const recOf=(kind,id)=>kind==='tickets'?ticket(id):kind==='problems'?problem(id):kind==='tasks'?task(id):change(id);
function attPanel(kind,rec,ro){
  const list=rec.attachments||[];
  return `<section class="panel" data-filedrop="${kind}:${rec.id}"><div class="head-row"><div><h2>Attachments</h2><p class="sub">${list.length?list.length+' file'+(list.length>1?'s':''):(ro?'No files.':'Drop files here or choose files. Up to 5 MB each.')}</p></div>
    ${ro?'':`<label class="btn sm" for="att-${kind}">${ic('paperclip')}Attach</label><input type="file" id="att-${kind}" multiple hidden data-in="att-add" data-kind="${kind}" data-id="${rec.id}">`}</div>
    ${list.map(m=>`<div class="att"><span class="attic">${ic('file')}</span><div style="min-width:0;flex:1"><button class="link" style="text-align:left;text-decoration:none;color:var(--ink);font-weight:500;overflow-wrap:anywhere" data-act="att-open" data-kind="${kind}" data-id="${rec.id}" data-att="${m.id}">${esc(m.name)}</button><div class="muted" style="font-size:12px">${fsize(m.size)} · ${esc(agentName(m.by))} · ${ago(m.at)}</div></div>
      <span class="tools"><button class="btn sm icon-btn" data-act="att-dl" data-kind="${kind}" data-id="${rec.id}" data-att="${m.id}" aria-label="Download ${esc(m.name)}">${ic('download')}</button>${ro?'':`<button class="btn sm icon-btn" data-act="att-del" data-kind="${kind}" data-id="${rec.id}" data-att="${m.id}" aria-label="Remove ${esc(m.name)}">${ic('trash')}</button>`}</span></div>`).join('')}</section>`;
}
async function attachTo(kind,id,files){
  const rec=recOf(kind,id);if(!rec||!files.length)return;
  const r=await addAttachments(rec,files);
  if(r.errs.length)toast(r.errs[0]+(r.errs.length>1?' (+'+(r.errs.length-1)+' more)':''));else toast(r.done.length+' file'+(r.done.length>1?'s':'')+' attached');
  refresh();
}
async function downloadAtt(kind,id,attId){
  const rec=recOf(kind,id),m=(rec.attachments||[]).find(x=>x.id===attId),blob=m&&await AttachStore.get(attId);
  if(!blob){toast('This file is not stored in this browser.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=m.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function previewAtt(kind,id,attId){
  const rec=recOf(kind,id),m=(rec.attachments||[]).find(x=>x.id===attId),blob=m&&await AttachStore.get(attId);
  if(!blob){toast('This file is not stored in this browser.');return}
  let body;
  if((m.type||'').startsWith('image/'))body=`<img src="${URL.createObjectURL(blob)}" alt="${esc(m.name)}" style="max-width:100%;border-radius:6px">`;
  else if((m.type||'').startsWith('text/')||/\.(txt|log|csv|json|md)$/i.test(m.name))body=`<pre class="pwd" style="white-space:pre-wrap;max-height:50vh;overflow:auto">${esc((await blob.text()).slice(0,20000))}</pre>`;
  else if(m.type==='application/pdf')body=`<iframe src="${URL.createObjectURL(blob)}" title="${esc(m.name)}" style="width:100%;height:60vh;border:0"></iframe>`;
  else body='<p class="muted">There is no preview for this file type. Use Download to open it.</p>';
  openModal(m.name,`<p class="muted" style="margin-bottom:10px">${fsize(m.size)} · added by ${esc(agentName(m.by))}, ${dtime(m.at)}</p>${body}`,[{t:'Close'},{t:'Download',cls:'primary',fn:()=>{downloadAtt(kind,id,attId);return false}}],{wide:true,noFocus:true});
}
const pendingChips=()=>UI.cmp.files.map((f,i)=>`<span class="chip grey">${ic('file')}${esc(f.name)} (${fsize(f.size)}) <button class="link" style="padding:0 0 0 4px" data-act="cmp-rmfile" data-i="${i}" aria-label="Remove ${esc(f.name)}">&times;</button></span>`).join('');
function addPending(files){
  for(const f of files){const e=checkFile(f);if(e){toast(e);continue}UI.cmp.files.push(f)}
  const box=$('#cmp-files');if(box)box.innerHTML=pendingChips();
}
document.addEventListener('paste',e=>{if(e.target.id==='cmp-text'&&e.clipboardData&&e.clipboardData.files.length){e.preventDefault();addPending([...e.clipboardData.files])}});
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
document.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();const z=e.target.closest('[data-filedrop]');$$('.filedrop').forEach(x=>{if(x!==z)x.classList.remove('filedrop')});if(z)z.classList.add('filedrop')});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-filedrop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('filedrop')});
document.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();const z=e.target.closest('[data-filedrop]');$$('.filedrop').forEach(x=>x.classList.remove('filedrop'));if(!z)return;
  const files=[...e.dataTransfer.files],[kind,id]=z.dataset.filedrop.split(':');if(kind==='cmp')addPending(files);else attachTo(kind,id,files)});
Object.assign(ACT,{
  'att-open':el=>previewAtt(el.dataset.kind,el.dataset.id,el.dataset.att),
  'att-dl':el=>downloadAtt(el.dataset.kind,el.dataset.id,el.dataset.att),
  'att-del':el=>{const rec=recOf(el.dataset.kind,el.dataset.id),m=rec.attachments.find(x=>x.id===el.dataset.att);confirmBox('Remove attachment','Remove <b>'+esc(m.name)+'</b>? This cannot be undone.','Remove',async()=>{await removeAttachment(rec,m.id);toast('Attachment removed');refresh()},true)},
  'cmp-rmfile':el=>{UI.cmp.files.splice(+el.dataset.i,1);$('#cmp-files').innerHTML=pendingChips()}
});
INP['att-add']=el=>{const files=[...el.files];el.value='';attachTo(el.dataset.kind,el.dataset.id,files)};
INP['cmp-files']=el=>{addPending([...el.files]);el.value=''};

/* ====================== ticket detail ====================== */
UI.cmp={mode:'reply',filter:'all',files:[]};
function slaRows(t){
  const now=Date.now(),respT=(t.sla.resp-t.createdAt)/MIN,resT=(t.sla.res-t.createdAt)/MIN;
  const respEl=((t.firstResponseAt||now)-t.createdAt)/MIN;
  const respStage=t.firstResponseAt?(t.firstResponseAt<=t.sla.resp?'Achieved':'Breached'):(now>t.sla.resp?'Breached':'In progress');
  const end=t.resolvedAt||now,pausedNow=t.pausedAt&&!t.resolvedAt?now-t.pausedAt:0;
  const resEl=(end-t.createdAt-t.pausedTotal-pausedNow)/MIN;
  let resStage=!isOpen(t)?(slaMet(t)?'Achieved':'Breached'):(t.pausedAt||t.status==='Awaiting approval')?'Paused':resEl>resT?'Breached':'In progress';
  return [{name:'Response',target:respT,el:respEl,stage:respStage,pct:respEl/respT*100},{name:'Resolution',target:resT,el:resEl,stage:resStage,pct:resEl/resT*100}];
}
const stageCls=s=>s==='Breached'?'bad':s==='Achieved'?'ok':s==='Paused'?'info':'grey';
function stageTracker(t){
  if(t.kind==='request'){
    const rej=t.resCode==='Request rejected',tasks=tasksOf(t.id);

/* state changes: every path (dropdown, board, buttons) goes through requestState so the rules are the same */
function requestState(t,to,after){
  const err=transitionError(t,to);
  if(err){toast(err);(after||refresh)();return false}
  if(to==='Resolved')return openResolve(t,after);
  if(to==='On Hold')return openHold(t,after);
  setStatus(t,to);toast(t.id+': '+to);(after||(()=>{refresh();renderNav(UI.sec)}))();
}
function openHold(t,after){
  const done=after||(()=>{refresh();renderNav(UI.sec)});
  openModal('Place '+t.id+' on hold',fld('On hold reason',`<select class="sel" id="hd-reason">${selOpts(HOLD_REASONS,t.holdReason||'Waiting for requester')}</select>`,'hd-reason','The resolution clock pauses only for Waiting for requester.')+fld('Comment for the requester *',`<textarea class="inp" id="hd-note" placeholder="Tell the requester what you are waiting for"></textarea>`,'hd-note'),
   [{t:'Cancel'},{t:'Place on hold',cls:'primary',fn:()=>{const n=val('hd-note');if(n.length<3)return fieldErr('hd-note','A comment is required when a ticket is placed on hold.');
     postReply(t,n,false,false);setStatus(t,'On Hold',{holdReason:val('hd-reason')});toast(t.id+' is on hold');done()}}],{onClose:after||refresh});
}
function openResolve(t,after){
  const err=transitionError(t,'Resolved');if(err){toast(err);(after||refresh)();return}
  openModal('Resolve '+t.id,fld('Resolution code *',`<select class="sel" id="rs-code">${selOpts(RESOLUTION_CODES,'Fixed')}</select>`,'rs-code')+
   fld('Resolution notes *',`<textarea class="inp" id="rs-note" placeholder="Describe the fix so the next agent can reuse it"></textarea>`,'rs-note')+
   `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rs-kb"> Create a knowledge article draft from this</label>`,
   [{t:'Cancel'},{t:'Resolve ticket',cls:'primary',fn:()=>{
     const note=val('rs-note');if(note.length<5)return fieldErr('rs-note','Resolution notes are required (at least 5 characters).');
     setStatus(t,'Resolved',{code:val('rs-code'),note});
     if($('#rs-kb').checked){const a=createArticle({title:t.title,cat:t.cat,body:'## Symptoms\n'+t.desc+'\n\n## Resolution\n'+note,tags:[t.cat.split(' ')[0].toLowerCase()]});toast(`${t.id} resolved. Draft article ${a.id} created.`)}else toast(t.id+' resolved');
     (after||(()=>{refresh();renderNav(UI.sec)}))()}}],{onClose:after||refresh});
}

Object.assign(INP,{

function declareMajor(t,impact,cmd){
  const id='MI-'+(++db.seq.m);t.major=true;
  db.majors.unshift({id,ticket:t.id,title:t.title,status:'Active',startedAt:Date.now(),commander:cmd,impact,resolvedAt:null,updates:[{at:Date.now(),by:cmd,text:'Major incident declared. '+impact}]});

}

function problemError(p,to){
  const i=PROBLEM_STEPS.indexOf(p.status),j=PROBLEM_STEPS.indexOf(to);
  if(p.status==='Closed')return 'Closed problems are read-only.';
  if(to===p.status)return null;
  if(p.status==='Fixed'&&(to==='Finding cause'||to==='Fix underway'))return null;
  if(j!==i+1)return 'Move through the states in order. The next state is '+(PROBLEM_STEPS[i+1]||'none')+'.';
  if(to==='Fix underway'&&p.rootCause.trim().length<5)return 'Add the root cause (cause notes) before moving to Fix underway.';
  if(to==='Fixed'&&openTasksOf(p.id).length)return 'Close all '+openTasksOf(p.id).length+' open problem task(s) before marking the problem fixed.';
  return null;
}
function changeProblemStatus(p,to){
  const err=problemError(p,to);if(err){toast(err);refresh();return}
  if(to===p.status){refresh();return}
  if(to==='Fixed'){const open=linked(p).filter(isOpen);
    openModal('Mark problem as fixed',`<p style="margin-bottom:12px">Mark <b>${esc(p.title)}</b> as fixed.</p>${fld('Resolution code *',`<select class="sel" id="rp-code">${selOpts(PROBLEM_CODES,'Fixed permanently')}</select>`,'rp-code')}${fld('Fix notes *',`<textarea class="inp" id="rp-note" placeholder="What fixed it?"></textarea>`,'rp-note')}${open.length?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rp-all" checked> Also resolve the ${open.length} linked open incidents</label>`:''}`,
      [{t:'Cancel'},{t:'Mark as fixed',cls:'primary',fn:()=>{if(val('rp-note').length<5)return fieldErr('rp-note','Fix notes are required (at least 5 characters).');
        if(open.length&&$('#rp-all').checked)open.forEach(t=>{if(!transitionError(t,'Resolved'))setStatus(t,'Resolved',{code:'Fixed',note:'Fixed by problem '+p.id+': '+val('rp-note')})});
        p.status='Fixed';p.resCode=val('rp-code');p.fixNotes=val('rp-note');p.resolvedAt=Date.now();addAct(p,'system','Fixed ('+p.resCode+'). '+p.fixNotes);log('Marked problem fixed',p.id);save();toast(p.id+' marked as fixed');refresh();renderNav('problems')}}],{onClose:refresh});return;
  }
  const back=p.status==='Fixed'&&to!=='Closed';
  if(back)p.resolvedAt=null;
  p.status=to;addAct(p,'system',back?'Problem reopened. State set to '+to:'State changed to '+to);log('Set problem state to '+to,p.id);save();refresh();renderNav('problems');
}

function chgError(c,to){

  if(to==='Risk review'&&c.status==='Draft'&&c.type==='Standard')return 'Standard changes go straight from Draft to Scheduled.';
  if(st.indexOf(to)!==st.indexOf(c.status)+1)return 'The next state is '+(st[st.indexOf(c.status)+1]||'none')+'.';
  if((to==='Approval'||(to==='Scheduled'&&c.status==='Draft'))&&!(c.backout||'').trim())return 'A backout plan is required.';
  if((to==='Approval'||(to==='Scheduled'&&c.status==='Draft'))&&!(c.plan||'').trim())return 'An implementation plan is required.';
  if(to==='Scheduled'&&c.status==='Approval')return 'The change is scheduled automatically once every approver agrees.';

/* CSV import: name,type,criticality,status,customer,location,serial,platform,warranty,device_owner_email,owner_email,managed_by_email,support_group */
function parseCsv(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
function importAssets(text){
  const rows=parseCsv(text);if(rows.length<2)return {ok:0,errs:['The file has no data rows.']};
  const head=rows[0].map(h=>h.trim().toLowerCase()),ix=k=>head.indexOf(k);
  if(ix('name')<0)return {ok:0,errs:['The first row must contain a "name" column.']};
  const g=(r,k)=>ix(k)>=0?(r[ix(k)]||'').trim():'',errs=[];let ok=0;
  rows.slice(1).forEach((r,n)=>{
    const name=g(r,'name');if(!name){errs.push('Row '+(n+2)+': name is empty');return}
    if(db.assets.some(a=>a.name.toLowerCase()===name.toLowerCase())){errs.push('Row '+(n+2)+': '+name+' already exists');return}
    const type=ASSET_TYPES.find(t=>t.toLowerCase()===g(r,'type').toLowerCase())||'Other',crit=CRIT.find(c=>c.toLowerCase()===g(r,'criticality').toLowerCase())||'Medium';
    const cu=db.customers.find(c=>c.name.toLowerCase()===g(r,'customer').toLowerCase())||db.customers.find(c=>c.id==='c-in');
    const byMail=m=>m?db.people.find(p=>p.email.toLowerCase()===m.toLowerCase()):null,agMail=m=>m?db.agents.find(p=>p.email.toLowerCase()===m.toLowerCase()):null;
    const grp=db.teams.find(t=>t.name.toLowerCase()===g(r,'support_group').toLowerCase());
    db.assets.push({id:nextId('a'),name,type,crit,status:'In use',environment:'Production',customer:cu.id,location:g(r,'location'),ident:g(r,'serial'),os:g(r,'platform'),warranty:g(r,'warranty')||new Date(Date.now()+365*DAY).toISOString().slice(0,10),dependsOn:[],notes:'',
      assignedTo:(byMail(g(r,'device_owner_email'))||{}).id||null,ownedBy:(byMail(g(r,'owner_email'))||{}).id||null,managedBy:(agMail(g(r,'managed_by_email'))||{}).id||null,supportGroup:grp?grp.id:null});ok++});
  if(ok){log('Imported '+ok+' assets','Assets');save()}
  return {ok,errs};
}

function windowStats(base,s,e){
  const created=base.filter(t=>t.createdAt>=s&&t.createdAt<e),resolved=base.filter(t=>t.resolvedAt&&t.resolvedAt>=s&&t.resolvedAt<e);
  const frt=created.filter(t=>t.firstResponseAt).map(t=>(t.firstResponseAt-t.createdAt)/MIN);
  const mt=resolved.map(t=>(t.resolvedAt-t.createdAt-t.pausedTotal)/HOUR),cs=resolved.filter(t=>t.csat).map(t=>t.csat);
  const openAt=base.filter(t=>t.createdAt<e&&(!t.resolvedAt||t.resolvedAt>=e)).length;
  return {created:created.length,resolved:resolved.length,sla:resolved.length?resolved.filter(slaMet).length/resolved.length*100:null,frt:median(frt),mttr:avg(mt),csat:cs.length?avg(cs):null,csatN:cs.length,backlog:openAt,list:created,res:resolved,reopen:resolved.length?resolved.filter(t=>t.reopened).length/resolved.length*100:0};
}
function delta(cur,prev,fmtFn,goodUp,unit){
  if(cur==null||prev==null)return '<em class="muted">No earlier data</em>';
  const d=cur-prev;if(Math.abs(d)<.05)return '<em class="muted">No change vs previous period</em>';
  const good=(d>0)===goodUp;return `<em class="${good?'good':'bad'}">${d>0?'&#9650;':'&#9660;'} ${fmtFn(Math.abs(d))}${unit||''} vs previous period</em>`;
}
function lineChart(series,labels,h){
  const W=760,H=h||250,L=40,R=10,T=10,B=26,n=labels.length;
  const max=Math.max(4,...series.flatMap(s=>s.values)),nice=Math.ceil(max/4)*4;
  const X=i=>L+(n<2?0:i*(W-L-R)/(n-1)),Y=v=>T+(H-T-B)*(1-v/nice);
  const grid=[0,1,2,3,4].map(i=>{const v=nice/4*i,y=Y(v);return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`}).join('');
  const step=Math.ceil(n/7),xl=labels.map((l,i)=>i%step===0?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${dshort(l)}</text>`:'').join('');
  const paths=series.map(s=>`<path d="${s.values.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`).join('');
  const hov=labels.map((l,i)=>`<rect x="${X(i)-(W-L-R)/n/2}" y="${T}" width="${(W-L-R)/n}" height="${H-T-B}" fill="transparent" data-tip="${esc(`<b>${dlong(l)}</b><br>`+series.map(s=>`${s.name}: ${s.values[i]}`).join('<br>'))}"/>`).join('');
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(' and '))} over time">${grid}${xl}${paths}${hov}</svg></div>`;
}
function agingChart(open){

function groupBy(list,fn){const m={};list.forEach(t=>{const k=fn(t);(m[k]=m[k]||[]).push(t)});return Object.entries(m).sort((a,b)=>b[1].length-a[1].length)}
function miniStats(a){return `<div class="mini">${a.map(([l,v,s])=>`<div><span>${l}</span><b>${v}</b><em>${s||''}</em></div>`).join('')}</div>`}
function repProcess(base,cur,from,end){
  const tab=UI.rep.tab,inc=cur.list.filter(t=>t.kind==='incident'),incR=cur.res.filter(t=>t.kind==='incident'),req=cur.list.filter(t=>t.kind==='request'),reqR=cur.res.filter(t=>t.kind==='request');
  const tbl=(head,rows)=>rows.length?`<div class="scroll"><table class="tbl"><thead><tr>${head.map((h,i)=>`<th class="${i>0?'r':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>0?'r':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:emptyMsg('Nothing to show for this period.');
  const slaOf=r=>r.length?(r.filter(slaMet).length/r.length*100).toFixed(0)+'%':'-';
  if(tab==='incident'){
    return miniStats([['Incidents created',inc.length,'in this period'],['Mean time to resolve',incR.length?avg(incR.map(t=>(t.resolvedAt-t.createdAt-t.pausedTotal)/HOUR)).toFixed(1)+' h':'-','resolved incidents'],['Reopened',incR.length?(incR.filter(t=>t.reopened).length/incR.length*100).toFixed(1)+'%':'-','of resolved incidents']])+
    `<h3 style="font-size:14px;margin-bottom:8px">Most frequent incidents</h3>`+tbl(['Incident','Count','Resolve time','SLA'],groupBy(inc,t=>t.title).slice(0,6).map(([k,v])=>{const r=v.filter(t=>t.resolvedAt);return [esc(k),v.length,r.length?avg(r.map(t=>(t.resolvedAt-t.createdAt-t.pausedTotal)/HOUR)).toFixed(1)+' h':'-',slaOf(r)]}));
  }
  if(tab==='request'){
    const ap=req.filter(t=>t.approval&&t.approval.state==='approved'&&t.approval.at).map(t=>(t.approval.at-t.createdAt)/HOUR);
    return miniStats([['Requests created',req.length,'in this period'],['Fulfilled on time',slaOf(reqR),reqR.length+' fulfilled'],['Average approval time',ap.length?avg(ap).toFixed(1)+' h':'-','for approved requests']])+
    `<h3 style="font-size:14px;margin-bottom:8px">Most order items</h3>`+tbl(['Catalog item','Requests','Fulfilled','On time'],groupBy(req.filter(t=>t.catalogId),t=>catalogItem(t.catalogId).name).slice(0,6).map(([k,v])=>{const r=v.filter(t=>t.resolvedAt);return [esc(k),v.length,r.length,slaOf(r)]}));
  }
  if(tab==='problem'){
    const op=db.problems.filter(prbOpen);
    return miniStats([['Open problems',op.length,'not yet resolved'],['Known errors',op.filter(p=>p.knownError).length,'workaround available'],['Incidents linked',db.tickets.filter(t=>t.problemId).length,'across all problems']])+
    `<h3 style="font-size:14px;margin-bottom:8px">Problems by impact</h3>`+tbl(['Problem','Status','Incidents','Open incidents'],db.problems.map(p=>[`<a href="#/problems/${p.id}">${p.id}</a> ${esc(p.title)}`,p.status,linked(p).length,linked(p).filter(isOpen).length]).sort((a,b)=>b[2]-a[2]));
  }
  if(tab==='change'){
    const dn=db.changes.filter(c=>c.status==='Closed'&&c.closeCode),ok=dn.filter(c=>c.closeCode!=='Did not work').length;
    return miniStats([['Success rate',dn.length?(ok/dn.length*100).toFixed(0)+'%':'-',dn.length+' finished changes'],['Emergency changes',db.changes.filter(c=>c.type==='Emergency').length,'all time'],['Awaiting approval',db.changes.filter(c=>c.status==='Approval').length,'CAB decision needed']])+
    `<h3 style="font-size:14px;margin-bottom:8px">Changes by status</h3>`+tbl(['Status','Changes','High risk'],groupBy(db.changes,c=>c.status).map(([k,v])=>[k,v.length,v.filter(c=>c.risk==='High').length]));
  }
  const sec=cur.list.filter(t=>t.cat==='Security alerts'),secR=cur.res.filter(t=>t.cat==='Security alerts');
  return miniStats([['Security tickets',sec.length,'created in this period'],['Median first response',sec.filter(t=>t.firstResponseAt).length?dur(median(sec.filter(t=>t.firstResponseAt).map(t=>(t.firstResponseAt-t.createdAt)/MIN))):'-','security tickets'],['Open critical and high',base.filter(t=>t.cat==='Security alerts'&&isOpen(t)&&t.priority<=2).length,'right now']])+
    `<h3 style="font-size:14px;margin-bottom:8px">Security tickets by type</h3>`+tbl(['Type','Count','SLA'],groupBy(sec,t=>t.title).slice(0,6).map(([k,v])=>[esc(k),v.length,slaOf(v.filter(t=>t.resolvedAt))]));
}
