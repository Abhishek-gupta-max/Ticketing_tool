UI.tsk={quick:'mine',q:'',type:'',team:'',agent:'',page:1};
const TASK_TYPES=['Task','Incident task','Catalog task','Change task','Problem task'];
const TQUICK={
  mine:['Assigned to me',t=>t.assignee===ME&&!taskClosed(t)],open:['All open',t=>!taskClosed(t)],
  overdue:['Overdue',t=>!taskClosed(t)&&t.due&&t.due<Date.now()],unassigned:['Unassigned',t=>!taskClosed(t)&&!t.assignee],
  closed:['Closed',t=>taskClosed(t)],all:['All',()=>true]};
const TST_CLS={'Waiting':'grey','Ready':'info','In progress':'ok','Done':'grey','Not done':'bad','Not needed':'grey'};
const taskChip=s=>`<span class="chip ${TST_CLS[s]||'grey'}">${esc(s)}</span>`;
const dueCell=t=>{if(!t.due)return '<span class="muted">-</span>';const late=!taskClosed(t)&&t.due<Date.now();return `<span class="${late?'bad':'muted'}" style="white-space:nowrap">${late?'Overdue ':''}${dshort(t.due)}</span>`};
function typeForParent(par){
  if(!par)return 'Task';
  if(par.id.startsWith('CHG-'))return 'Change task';
  if(par.id.startsWith('PRB-'))return 'Problem task';
  return par.kind==='request'?'Catalog task':'Incident task';
}
function tasksPanel(rec,ro){
  const ts=tasksOf(rec.id),done=ts.filter(taskClosed).length;
  const isChg=rec.id.startsWith('CHG-'),isPrb=rec.id.startsWith('PRB-');
  const label=isChg?'Change tasks':isPrb?'Problem tasks':rec.kind==='request'?'Catalog tasks':'Incident tasks';
  if(!ts.length&&ro)return '';
  return `<section class="panel" style="margin-top:16px"><div class="head-row"><div><h2>${label}</h2><p class="sub">${ts.length?`${done} of ${ts.length} closed. All tasks must be closed before ${isChg?'the change can move to Review':'this record can be resolved'}.`:'No tasks yet. Add tasks to split the work between people.'}</p></div>${ro?'':`<button class="btn sm" data-act="task-add" data-parent="${rec.id}">${ic('plus')}Add task</button>`}</div>
   ${ts.map(x=>{const pool=db.agents.filter(a=>a.active&&(memberOf(a,x.team)||a.id===x.assignee));return `<div class="task"><div style="min-width:0"><a href="#/tasks/${x.id}" style="font-weight:500;color:var(--ink)">${esc(x.title)}</a><div class="muted" style="font-size:12px"><span class="id">${x.id}</span> · ${x.sequential?'Step '+(x.order+1)+' of '+ts.length:'Parallel'}${x.due?' · due '+dshort(x.due):''}</div></div>
     <div class="tools"><select class="sel" data-in="task-asg" data-tid="${x.id}" ${ro||taskClosed(x)?'disabled':''} aria-label="Assigned to for ${esc(x.title)}">${selOpts(pool.map(a=>[a.id,agentName(a.id)]),x.assignee||'','Unassigned')}</select>
     <select class="sel" data-in="task-state" data-tid="${x.id}" ${ro||taskClosed(x)||x.state==='Waiting'?'disabled':''} aria-label="State of ${esc(x.title)}">${selOpts(taskStates(x),x.state)}</select></div></div>`}).join('')}
   ${ts.length&&done===ts.length&&!ro?'<p class="good" style="margin-top:10px"><b>All tasks are closed.</b></p>':''}</section>`;
}
PAGES.tasks=function(id){
  if(id)return taskDetail(id);
  const f=UI.tsk,now=Date.now(),open=db.tasks.filter(t=>!taskClosed(t));
  $('#view').innerHTML=`
  <div class="ph"><div><h1>Tasks</h1><p>Every unit of work in one list: catalog, change, problem and incident tasks, and stand-alone tasks.</p></div><div class="tools"><button class="btn primary" data-act="task-add">${ic('plus')}New task</button></div></div>
  <div class="kpis">${kpi('Open tasks',open.length,`${open.filter(t=>t.state==='Waiting').length} waiting on an earlier task`)}${kpi('Assigned to me',open.filter(t=>t.assignee===ME).length,'not yet closed')}${kpi('Overdue',open.filter(t=>t.due&&t.due<now).length,'past their due date')}${kpi('Unassigned',open.filter(t=>!t.assignee).length,'need an owner')}${kpi('Closed this week',db.tasks.filter(t=>t.closedAt&&t.closedAt>now-7*DAY).length,'completed or skipped')}</div>
  <div class="views" id="tsk-quick"></div>
  <div class="toolbar"><input class="inp q" type="search" placeholder="Search number or description" value="${esc(f.q)}" data-in="tsk-q" aria-label="Search tasks">
   <select class="sel" data-in="tsk-f" data-f="type" aria-label="Type">${selOpts(TASK_TYPES,f.type,'All types')}</select>
   <select class="sel" data-in="tsk-f" data-f="team" aria-label="Team">${teamOpts(f.team,'All groups',true)}</select>
   <select class="sel" data-in="tsk-f" data-f="agent" aria-label="Assigned to">${selOpts([['none','Unassigned'],...db.agents.filter(a=>a.active).map(a=>[a.id,agentName(a.id)])],f.agent,'Anyone')}</select></div>
  <section class="panel" style="padding:12px 14px"><div id="tsk-body"></div></section>`;
  tskBody();
};
function tskFiltered(){
  const f=UI.tsk,q=f.q.trim().toLowerCase();
  return db.tasks.filter(TQUICK[f.quick][1]).filter(t=>(!f.type||t.type===f.type)&&(!f.team||t.team===f.team)&&(!f.agent||(f.agent==='none'?!t.assignee:t.assignee===f.agent))&&(!q||(t.id+t.title+(t.parent||'')).toLowerCase().includes(q)))
    .sort((a,b)=>taskClosed(a)-taskClosed(b)||(a.due||9e15)-(b.due||9e15));
}
function tskBody(){
  const f=UI.tsk,l=tskFiltered(),pages=Math.max(1,Math.ceil(l.length/25));if(f.page>pages)f.page=pages;
  $('#tsk-quick').innerHTML=Object.keys(TQUICK).map(k=>`<button data-act="tsk-quick" data-k="${k}" aria-pressed="${f.quick===k}">${TQUICK[k][0]}<small>${db.tasks.filter(TQUICK[k][1]).length}</small></button>`).join('');
  const s=l.slice((f.page-1)*25,f.page*25);
  $('#tsk-body').innerHTML=s.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Number</th><th>Summary</th><th>Type</th><th>Parent</th><th>State</th><th>Priority</th><th>Team</th><th>Assigned to</th><th>Due</th></tr></thead><tbody>${s.map(t=>`<tr data-go="#/tasks/${t.id}"><td class="id">${t.id}</td><td class="title">${esc(t.title)}</td><td class="muted" style="white-space:nowrap">${esc(t.type)}</td><td>${t.parent?`<a href="${hrefOf(t.parent)}">${t.parent}</a>`:'<span class="muted">None</span>'}</td><td>${taskChip(t.state)}</td><td>${priChip(t.priority)}</td><td style="white-space:nowrap">${esc(team(t.team).name)}</td><td>${ownerCell(t.assignee)}</td><td>${dueCell(t)}</td></tr>`).join('')}</tbody></table></div>
    <div class="pager"><span>Showing ${(f.page-1)*25+1} to ${Math.min(l.length,f.page*25)} of ${l.length}</span><span class="tools"><button class="btn sm" data-act="tsk-page" data-d="-1" ${f.page<=1?'disabled':''}>${ic('chevL')}Previous</button><span>Page ${f.page} of ${pages}</span><button class="btn sm" data-act="tsk-page" data-d="1" ${f.page>=pages?'disabled':''}>Next${ic('chevR')}</button></span></div>`:emptyMsg('No tasks match. Try another view.');
}
function taskDetail(id){
  const t=task(id);
  if(!t){$('#view').innerHTML=`<div class="panel">${emptyMsg('Task '+esc(id)+' was not found.')}<div style="text-align:center"><a class="btn" href="#/tasks">Back to tasks</a></div></div>`;return}
  const par=findRec(t.parent),ro=taskClosed(t),dis=ro?'disabled':'';
  const sibs=t.parent?tasksOf(t.parent).filter(x=>x.id!==t.id):[];
  const pool=db.agents.filter(a=>a.active&&(memberOf(a,t.team)||a.id===t.assignee));
  const prev=t.sequential&&t.state==='Waiting'?tasksOf(t.parent).filter(x=>x.order<t.order&&!taskClosed(x)).pop():null;
  $('#view').innerHTML=`
  <div class="crumb"><a href="#/tasks">Tasks</a> / ${t.id}</div>
  <div class="ph" style="margin-bottom:8px"><div style="min-width:0"><div class="chips"><span class="id">${t.id}</span><span class="chip grey">${esc(t.type)}</span>${taskChip(t.state)}${priChip(t.priority)}</div><h1 class="dtitle">${esc(t.title)}</h1></div>
   <div class="tools">${t.state==='Ready'?`<button class="btn" data-act="task-do" data-id="${t.id}" data-to="In progress">Start work</button>`:''}${!ro&&t.state!=='Waiting'?`<button class="btn primary" data-act="task-do" data-id="${t.id}" data-to="Done">${ic('check')}Close complete</button>`:''}${!ro&&t.assignee!==ME?`<button class="btn" data-act="task-take" data-id="${t.id}">Assign to me</button>`:''}</div></div>
  ${ro?`<div class="banner info"><div><b>This task is closed and read-only.</b></div></div>`:''}
  ${prev?`<div class="banner warn"><div><b>Waiting for an earlier step.</b> This task opens when <a href="#/tasks/${prev.id}">${prev.id}: ${esc(prev.title)}</a> is closed.</div></div>`:''}
  <div class="dgrid"><div>
   ${par?`<section class="panel"><h2>Parent record</h2><div class="linkrow"><span><a href="${hrefOf(par.id)}"><b>${par.id}</b></a> ${esc(par.title)}</span><span>${par.status?`<span class="chip grey">${esc(par.status)}</span>`:''}</span></div></section>`:''}
   <section class="panel" style="${par?'margin-top:16px':''}"><h2>Description</h2><p class="desc" style="margin-top:8px">${esc(t.desc)||'<span class="muted">No description.</span>'}</p>${t.closeNotes?`<dl class="props" style="margin-top:14px"><dt>Close notes</dt><dd class="desc">${esc(t.closeNotes)}</dd></dl>`:''}</section>
   ${sibs.length?`<section class="panel" style="margin-top:16px"><h2>Other tasks on ${esc(t.parent)}</h2>${sibs.map(x=>`<div class="linkrow"><span><a href="#/tasks/${x.id}">${x.id}</a> ${esc(x.title)}</span>${taskChip(x.state)}</div>`).join('')}</section>`:''}
   <section class="panel" style="margin-top:16px"><h2>Internal notes</h2><p class="sub">Notes are visible to agents only.</p>
    ${ro?'':`<div class="composer"><textarea id="tn-text" placeholder="Add a work note" aria-label="Add a work note"></textarea><div class="foot"><span></span><button class="btn primary" data-act="task-note" data-id="${t.id}">Post work note</button></div></div>`}
    <div class="acts-list" style="margin-top:12px">${[...t.activity].sort((a,b)=>b.at-a.at).map(a=>a.type==='system'?`<div class="ev sys"><span>${esc(a.text)} <span class="muted">· ${dtime(a.at)}</span></span></div>`:`<div class="ev">${avatar(a.by)}<div class="bub note"><div class="h"><span><b>${esc(agentName(a.by))}</b> · work note</span><span>${dtime(a.at)}</span></div><p>${esc(a.text)}</p></div></div>`).join('')}</div></section>
  </div><div class="side-col">
   <section class="panel"><h2>Details</h2><dl class="props" style="margin-top:12px">
    <dt>State</dt><dd><select class="sel" data-in="task-prop" data-f="state" data-id="${t.id}" aria-label="State" ${dis}>${selOpts(taskStates(t),t.state)}</select></dd>
    <dt>Priority</dt><dd><select class="sel" data-in="task-prop" data-f="priority" data-id="${t.id}" aria-label="Priority" ${dis}>${selOpts([[1,'P1 Critical'],[2,'P2 High'],[3,'P3 Medium'],[4,'P4 Low']],t.priority)}</select></dd>
    <dt>Team</dt><dd><select class="sel" data-in="task-prop" data-f="team" data-id="${t.id}" aria-label="Team" ${dis}>${teamOpts(t.team,null,true)}</select></dd>
    <dt>Assigned to</dt><dd><select class="sel" data-in="task-prop" data-f="assignee" data-id="${t.id}" aria-label="Assigned to" ${dis}>${selOpts(pool.map(a=>[a.id,agentName(a.id)]),t.assignee||'','Unassigned')}</select></dd>
    <dt>Due</dt><dd><input class="inp" type="datetime-local" value="${t.due?toLocalInput(t.due):''}" data-in="task-prop" data-f="due" data-id="${t.id}" aria-label="Due" ${dis}></dd>
    <dt>Type</dt><dd>${esc(t.type)}</dd><dt>Sequence</dt><dd>${t.sequential?'Step '+(t.order+1)+', starts after the previous step':'Runs in parallel with other tasks'}</dd>
    <dt>Created</dt><dd>${dtime(t.createdAt)}</dd>${t.closedAt?`<dt>Closed</dt><dd>${dtime(t.closedAt)}</dd>`:''}</dl></section>
   ${attPanel('tasks',t,ro)}
  </div></div>`;
}
function openTaskClose(t,state,after){
  const need=state!=='Done';
  openModal((state==='Done'?'Close ':state==='Not done'?'Close incomplete: ':'Skip ')+t.id,fld('Close notes'+(need?' *':''),`<textarea class="inp" id="tc-note" placeholder="${need?'Why was this task not completed?':'Optional: what was done?'}"></textarea>`,'tc-note'),
   [{t:'Cancel'},{t:'Save',cls:'primary',fn:()=>{const n=val('tc-note');if(need&&n.length<3)return fieldErr('tc-note','Close notes are required for this state.');setTaskState(t,state,n);toast(t.id+': '+state);(after||(()=>{refresh();renderNav(UI.sec)}))()}}],{onClose:after||refresh});
}
function taskAddDialog(parentId){
  const par=findRec(parentId);
  const body=`${fld('Summary *',`<input class="inp" id="tk-title" placeholder="What needs to be done?">`,'tk-title')}
   ${fld('Description',`<textarea class="inp" id="tk-desc"></textarea>`,'tk-desc')}
   ${par?`<p class="muted" style="margin-bottom:12px">Parent: <b>${par.id}</b> ${esc(par.title)}. This will be a <b>${typeForParent(par)}</b>.</p>`:fld('Parent record (optional)',`<input class="inp" id="tk-parent" placeholder="For example INC0010001, CHG0030001 or PRB0040001">`,'tk-parent','Leave empty for a stand-alone task.')}
   <div class="row2">${fld('Team',`<select class="sel" id="tk-team" data-in="tk-team">${teamOpts(par&&par.team||'sd',null)}</select>`,'tk-team')}${fld('Assigned to',`<select class="sel" id="tk-asg"></select>`,'tk-asg')}</div>
   <div class="row2">${fld('Priority',`<select class="sel" id="tk-pri">${selOpts([[1,'P1 Critical'],[2,'P2 High'],[3,'P3 Medium'],[4,'P4 Low']],3)}</select>`,'tk-pri')}${fld('Due',`<input class="inp" type="datetime-local" id="tk-due" value="${toLocalInput(Date.now()+2*DAY)}">`,'tk-due')}</div>`;
  openModal('New task',body,[{t:'Cancel'},{t:'Create task',cls:'primary',fn:()=>{
    if(val('tk-title').length<3)return fieldErr('tk-title','Add a short description.');
    let p=par;if(!p&&val('tk-parent')){p=findRec(val('tk-parent').toUpperCase());if(!p)return fieldErr('tk-parent','No ticket, change or problem has that number.')}
    const due=fromLocalInput(val('tk-due'));
    const t=createTask({type:typeForParent(p),parent:p?p.id:null,title:val('tk-title'),desc:$('#tk-desc').value.trim(),assignee:val('tk-asg')||null,team:val('tk-team'),priority:+val('tk-pri'),due:isNaN(due)?null:due,order:p?tasksOf(p.id).length:0});
    toast(t.id+' created');go('#/tasks/'+t.id)}}],{onOpen:()=>INP['tk-team']($('#tk-team'))});
}
Object.assign(ACT,{
  'tsk-quick':el=>{UI.tsk.quick=el.dataset.k;UI.tsk.page=1;tskBody()},
  'tsk-page':el=>{UI.tsk.page+=+el.dataset.d;tskBody()},
  'task-add':el=>taskAddDialog(el.dataset.parent),
  'task-do':el=>{const t=task(el.dataset.id),to=el.dataset.to;if(taskClosed(t))return;if(to==='In progress'){setTaskState(t,to);refresh();renderNav(UI.sec);return}openTaskClose(t,to)},
  'task-take':el=>{const t=task(el.dataset.id);t.assignee=ME;if(!memberOf(agent(ME),t.team))t.team=agent(ME).team;addAct(t,'system','Assigned to You');log('Assigned task to You',t.id);save();toast(t.id+' assigned to you');refresh();renderNav(UI.sec)},
  'task-note':el=>{const t=task(el.dataset.id),n=val('tn-text');if(!n){toast('Write a note first');return}addAct(t,'note',n);log('Added task work note',t.id);save();refresh()}
});
Object.assign(INP,{
  'tsk-q':el=>{UI.tsk.q=el.value;UI.tsk.page=1;tskBody()},
  'tsk-f':el=>{UI.tsk[el.dataset.f]=el.value;UI.tsk.page=1;tskBody()},
  'tk-team':el=>{const tm=el.value;$('#tk-asg').innerHTML=selOpts(teamMembers(tm).map(a=>[a.id,agentName(a.id)]),'','Unassigned')},
  'task-state':el=>{const x=task(el.dataset.tid),v=el.value;if(v==='Not done'||v==='Not needed'){openTaskClose(x,v);return}setTaskState(x,v);refresh();renderNav(UI.sec)},
  'task-asg':el=>{const x=task(el.dataset.tid);x.assignee=el.value||null;addAct(x,'system','Assigned to '+agentName(x.assignee));log('Assigned task',x.id);save();refresh();renderNav(UI.sec)},
  'task-prop':el=>{const t=task(el.dataset.id),f=el.dataset.f,v=el.value;if(taskClosed(t)){refresh();return}
    if(f==='state'){if(v==='Not done'||v==='Not needed'||v==='Done'){openTaskClose(t,v);return}setTaskState(t,v)}
    else if(f==='priority'){t.priority=+v;addAct(t,'system','Priority set to '+PRI[t.priority])}
    else if(f==='team'){t.team=v;if(t.assignee&&!memberOf(agent(t.assignee),v)){addAct(t,'system','Team changed to '+team(v).name+'. '+agentName(t.assignee)+' was unassigned.');t.assignee=null}else addAct(t,'system','Team changed to '+team(v).name)}
    else if(f==='assignee'){t.assignee=v||null;addAct(t,'system','Assigned to '+agentName(t.assignee))}
    else if(f==='due'){const d=fromLocalInput(v);t.due=isNaN(d)?null:d;addAct(t,'system','Due date set to '+(t.due?dtime(t.due):'none'))}
    t.updatedAt=Date.now();log('Updated task',t.id);save();refresh();renderNav(UI.sec)}
});

/* ====================== approvals ====================== */
UI.apr={tab:'mine'};
PAGES.approvals=function(){
  const now=Date.now(),mine=myApprovals();
  const allReq=db.tickets.filter(t=>t.status==='Awaiting approval'&&t.approval&&t.approval.state==='pending'),allChg=db.changes.filter(c=>c.status==='Approval');
  const decided=[];
  db.tickets.forEach(t=>{if(t.approval&&t.approval.state!=='pending'&&t.approval.at&&t.approval.at>now-30*DAY)decided.push({rec:t,kind:'request',decision:t.approval.state,by:t.approval.by,at:t.approval.at})});
  db.changes.forEach(c=>c.approvals.forEach(a=>{if(a.decision!=='pending'&&a.at&&a.at>now-30*DAY&&c.status!=='New')decided.push({rec:c,kind:'change',decision:a.decision,by:agentName(a.who)+' ('+a.role+')',at:a.at})}));
  decided.sort((a,b)=>b.at-a.at);
  const f=UI.apr;
  const rowMine=x=>`<li><div style="min-width:0"><a href="${hrefOf(x.rec.id)}" style="color:var(--ink);text-decoration:none"><b>${esc(x.rec.title)}</b></a><span class="s">${x.rec.id} · ${x.kind==='change'?'Change · '+esc(x.role)+(x.who!==ME?' (on behalf of '+esc(agentName(x.who))+')':''):'Order item · '+esc(personName(x.rec.requester))+', '+esc(custName(x.rec.cust))} · waiting ${ago(x.at)}</span></div>
    <div class="tools">${x.kind==='change'?`<button class="btn sm primary" data-act="chg-vote" data-id="${x.rec.id}" data-i="${x.idx}" data-v="approved">Approve</button><button class="btn sm danger" data-act="chg-vote" data-id="${x.rec.id}" data-i="${x.idx}" data-v="rejected">Reject</button>`:`<button class="btn sm primary" data-act="tk-approve" data-id="${x.rec.id}">Approve</button><button class="btn sm danger" data-act="tk-reject" data-id="${x.rec.id}">Reject</button>`}</div></li>`;
  let body;
  if(f.tab==='mine')body=mine.length?`<section class="panel"><h2>Waiting for your decision</h2><p class="sub">${can('settings')?'As an admin you can also decide on behalf of other approvers.':'These are the approvals assigned to you.'}</p><ul class="plain">${mine.map(rowMine).join('')}</ul></section>`:`<section class="panel">${emptyMsg('Nothing is waiting for you. Switch user at the bottom of the sidebar to see another approver\'s queue.')}</section>`;
  else if(f.tab==='all'){
    const rows=[...allReq.map(t=>({rec:t,who:'Line manager',kind:'Order item',at:t.approval.at})),...allChg.flatMap(c=>c.approvals.map(a=>a.decision==='pending'?{rec:c,who:agentName(a.who)+', '+a.role,kind:'Change',at:c.updatedAt}:null).filter(Boolean))].sort((a,b)=>a.at-b.at);
    body=`<section class="panel" style="padding:12px 14px">${rows.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Type</th><th>Record</th><th>Summary</th><th>Waiting for</th><th>Waiting</th></tr></thead><tbody>${rows.map(r=>`<tr data-go="${hrefOf(r.rec.id)}"><td>${r.kind}</td><td class="id">${r.rec.id}</td><td class="title">${esc(r.rec.title)}</td><td>${esc(r.who)}</td><td class="muted">${ago(r.at)}</td></tr>`).join('')}</tbody></table></div>`:emptyMsg('No approvals are pending anywhere.')}</section>`;
  }else body=`<section class="panel" style="padding:12px 14px">${decided.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Type</th><th>Record</th><th>Summary</th><th>Decision</th><th>Decided by</th><th>When</th></tr></thead><tbody>${decided.slice(0,40).map(r=>`<tr data-go="${hrefOf(r.rec.id)}"><td>${r.kind==='change'?'Change':'Order item'}</td><td class="id">${r.rec.id}</td><td class="title">${esc(r.rec.title)}</td><td><span class="chip ${r.decision==='approved'?'ok':'bad'}">${r.decision==='approved'?'Approved':'Rejected'}</span></td><td>${esc(r.by)}</td><td class="muted">${ago(r.at)}</td></tr>`).join('')}</tbody></table></div>`:emptyMsg('No decisions in the last 30 days.')}</section>`;
  $('#view').innerHTML=`
  <div class="ph"><div><h1>Approvals</h1><p>Requests and changes that need a decision. You are acting as <b>${esc(agentName(ME))}</b> (${esc((agent(ME)||{}).role)}).</p></div></div>
  <div class="kpis">${kpi('Waiting for me',mine.length,'need your decision')}${kpi('Order items waiting',allReq.length,'line manager approval')}${kpi('Changes at CAB',allChg.length,'awaiting approvers')}${kpi('Decided, last 30 days',decided.length,`${decided.filter(d=>d.decision==='rejected').length} rejected`)}</div>
  <div class="tabs" role="tablist">${[['mine','Waiting for me'],['all','Everyone\'s pending'],['history','History']].map(([k,l])=>`<button role="tab" aria-selected="${f.tab===k}" data-act="apr-tab" data-k="${k}">${l}</button>`).join('')}</div>${body}`;
};
ACT['apr-tab']=el=>{UI.apr.tab=el.dataset.k;PAGES.approvals()};

/* ====================== start ====================== */
function ensureDefaults(){
  const S=db.settings;
  if(!S.schedules)S.schedules=[{id:'s1',name:'Weekly SLA summary',freq:'Weekly',when:'Monday 09:00',fmt:'PDF',to:'ops@veltrixsecure.example'}];
  if(!S.canned)S.canned=[];
  ['tasks','requests','views','teams'].forEach(k=>{if(!db[k])db[k]=[]});
  if(!S.routing)S.routing={...CAT_TEAM};
  if(!agent(ME))ME='a0';
  if(!db.majors)db.majors=[];
  if(!db.seq.m)db.seq.m=db.majors.length;
}
(function init(){
  db=loadDb()||seed();ensureDefaults();runAutoClose();
  let th='light';try{th=localStorage.getItem('vlx-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
  setTheme(th);
  $('#menuBtn').innerHTML=ic('menu');$('#newIco').innerHTML=ic('plus');$('#bellIco').innerHTML=ic('bell');$('#themeIco').innerHTML=ic('moon');$('#gIco').innerHTML=ic('search');
  if(!location.hash)location.hash='#/overview';
  renderMe();
  route();
  saveNow();
  seedAttachments().then(()=>{if(UI.sec==='tickets'||UI.sec==='overview')refresh()});
  setInterval(saveNow,20000);
  addEventListener('beforeunload',saveNow);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
  setInterval(()=>{if(!$('#modal').open){updateBell();renderNav(UI.sec)}},60000);
})();

</script>
